<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Marina Bay · Singapore — three.js</title>
<style>
  :root{
    --bg:#05070c;
    --ink:#e8eef7;
    --dim:#8fa0b8;
    --line:rgba(255,255,255,.12);
    --glass:rgba(10,16,26,.55);
    --accent:#63d3ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased}
  canvas{display:block;width:100%;height:100%}

  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}

  #brand{position:absolute;left:22px;top:18px;pointer-events:none}
  #brand h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.16em;text-transform:uppercase}
  #brand h1 b{color:var(--accent);font-weight:650}
  #brand p{margin:5px 0 0;font-size:11.5px;letter-spacing:.09em;color:var(--dim);text-transform:uppercase}

  #panel{position:absolute;left:22px;bottom:20px;display:flex;flex-direction:column;gap:8px;
    padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--glass);
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    pointer-events:auto;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .lbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
    width:46px;flex:0 0 46px}
  button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--ink);font:inherit;font-size:11.5px;letter-spacing:.05em;padding:6px 11px;
    border-radius:9px;cursor:pointer;transition:.18s ease;white-space:nowrap}
  button:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28)}
  button.on{background:linear-gradient(180deg,rgba(99,211,255,.28),rgba(99,211,255,.12));
    border-color:rgba(99,211,255,.6);color:#dff4ff;box-shadow:0 0 18px rgba(99,211,255,.22)}

  #hint{position:absolute;right:20px;bottom:20px;font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--dim);text-align:right;pointer-events:none}
  #hint b{color:#cfe0f4;font-weight:600}

  #stats{position:absolute;right:20px;top:18px;font-size:10.5px;letter-spacing:.1em;
    color:var(--dim);text-align:right;pointer-events:none;font-variant-numeric:tabular-nums}

  #labels{position:fixed;inset:0;pointer-events:none;z-index:9}
  .tag{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;
    gap:7px;white-space:nowrap;will-change:transform,opacity;transition:opacity .25s}
  .tag i{width:6px;height:6px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 3px rgba(99,211,255,.16),0 0 14px rgba(99,211,255,.9);flex:0 0 6px}
  .tag span{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:#eaf3ff;
    background:rgba(6,11,19,.5);border:1px solid rgba(255,255,255,.13);padding:3px 8px;border-radius:20px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

  #boot{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#05070c;
    transition:opacity .9s ease}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .box{text-align:center}
  #boot .ring{width:44px;height:44px;margin:0 auto 18px;border-radius:50%;
    border:2px solid rgba(255,255,255,.14);border-top-color:var(--accent);animation:spin 1s linear infinite}
  #boot p{margin:0;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  @keyframes spin{to{transform:rotate(360deg)}}
  #fatal{position:fixed;inset:0;display:none;place-items:center;padding:32px;text-align:center;
    font-size:13px;line-height:1.7;color:var(--dim);z-index:60}

  @media (max-width:720px){
    #brand h1{font-size:15px}#brand p{display:none}
    #panel{left:12px;right:12px;bottom:12px}
    .lbl{display:none}
    #hint,#stats{display:none}
  }
</style>
</head>
<body>
<div id="labels"></div>
<div id="hud">
  <div id="brand">
    <h1>Marina <b>Bay</b></h1>
    <p>Singapore · 1.2836° N 103.8607° E · real-time WebGL</p>
  </div>
  <div id="stats"></div>
  <div id="panel">
    <div class="row"><span class="lbl">Light</span>
      <button data-mode="night" class="on">Night</button>
      <button data-mode="dusk">Dusk</button>
      <button data-mode="day">Day</button>
    </div>
    <div class="row"><span class="lbl">Views</span>
      <button data-view="bay">Bay</button>
      <button data-view="mbs">Marina Bay Sands</button>
      <button data-view="flyer">Singapore Flyer</button>
      <button data-view="gardens">Gardens</button>
      <button data-view="merlion">Merlion</button>
      <button data-view="aerial">Aerial</button>
    </div>
    <div class="row"><span class="lbl">Scene</span>
      <button id="btnTour">Tour</button>
      <button id="btnLabels" class="on">Labels</button>
      <button id="btnFx" class="on">Fireworks</button>
      <button id="btnOrbit">Auto-orbit</button>
    </div>
  </div>
  <div id="hint"><b>drag</b> orbit &nbsp;·&nbsp; <b>scroll</b> zoom &nbsp;·&nbsp; <b>right-drag</b> pan</div>
</div>
<div id="boot"><div class="box"><div class="ring"></div><p>Building the bay…</p></div></div>
<div id="fatal">This scene needs WebGL and an internet connection (three.js is loaded from a CDN).</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Water } from 'three/addons/objects/Water.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('boot').style.display = 'none';
  document.getElementById('fatal').style.display = 'grid';
  throw e;
}

const TILE_W = 48, TILE_H = 64;
const LAND_TOP = 3;

let seed = 20260918;
function rng() {
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const rnd = (a, b) => a + rng() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[(rng() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.info.autoReset = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b1524, 400, 3200);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 1.5, 9000);
camera.position.set(1500, 460, 1600);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.target.set(-120, 90, 180);
controls.minDistance = 60;
controls.maxDistance = 2400;
controls.maxPolarAngle = Math.PI * .497;
controls.autoRotateSpeed = .35;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), .7, .6, .8);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const nightMats = [];
function reg(mat, intensity = 1) {
  const e = { mat, base: intensity };
  if (mat.isSpriteMaterial || mat.isPointsMaterial) { e.kind = 'opacity'; e.base = mat.opacity; }
  else if (mat.isMeshBasicMaterial) { e.kind = 'color'; e.baseColor = mat.color.clone(); }
  else { e.kind = 'emissive'; e.base = mat.emissiveIntensity !== undefined ? mat.emissiveIntensity : intensity; }
  nightMats.push(e);
  return mat;
}

function canvasTex(draw, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  return t;
}

function windowTex(bays, floors, lit, base, winDark, palette) {
  const cw = 6, ch = 8;
  const ca = document.createElement('canvas'); ca.width = bays * cw; ca.height = floors * ch;
  const ce = document.createElement('canvas'); ce.width = bays * cw; ce.height = floors * ch;
  const ga = ca.getContext('2d'), ge = ce.getContext('2d');
  ga.fillStyle = base; ga.fillRect(0, 0, ca.width, ca.height);
  ge.fillStyle = '#000000'; ge.fillRect(0, 0, ce.width, ce.height);
  for (let f = 0; f < floors; f++) {
    const floorLit = rng() < .82;
    for (let b = 0; b < bays; b++) {
      const x = b * cw, y = f * ch;
      const isLit = floorLit && rng() < lit;
      ga.globalAlpha = .75 + rng() * .25;
      ga.fillStyle = rng() < .12 ? base : winDark;
      ga.fillRect(x + 1, y + 1.5, cw - 2, ch - 3.2);
      ga.globalAlpha = 1;
      if (isLit) {
        ge.globalAlpha = .5 + rng() * .5;
        ge.fillStyle = pick(palette);
        ge.fillRect(x + 1, y + 1.5, cw - 2, ch - 3.2);
        ge.globalAlpha = 1;
      }
    }
    ga.fillStyle = 'rgba(0,0,0,.34)';
    ga.fillRect(0, f * ch + ch - 1.6, ca.width, 1.6);
    for (let b = 1; b < bays; b++) {
      ga.fillStyle = 'rgba(0,0,0,.22)';
      ga.fillRect(b * cw - .8, 0, 1.2, ca.height);
    }
  }
  const mk = c => {
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    return t;
  };
  return [mk(ca), mk(ce)];
}

const warm = ['#ffe7b4', '#ffd79a', '#fff2d4', '#ffcf85', '#f6e3c0'];
const cool = ['#d6e8ff', '#bcd8ff', '#eaf3ff', '#a8c8f0', '#cfe2ff'];
const texGlass = windowTex(16, 16, .5, '#5f6d7d', '#39465a', cool.concat(warm));
const texOffice = windowTex(16, 16, .34, '#7d7566', '#4c463a', warm);
const texRes = windowTex(16, 16, .42, '#6b6f74', '#474b50', warm.concat(cool));

function boxUV(geo, w, h, d) {
  const uv = geo.attributes.uv;
  const sizes = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (const g of geo.groups) {
    const s = sizes[g.materialIndex] || [w, h];
    for (let i = g.start; i < g.start + g.count; i++) {
      uv.setXY(i, uv.getX(i) * s[0] / TILE_W, uv.getY(i) * s[1] / TILE_H);
    }
  }
  uv.needsUpdate = true;
  return geo;
}

function facadeMat(tex, rough, metal, em = 1.3) {
  return reg(new THREE.MeshStandardMaterial({
    map: tex[0], emissiveMap: tex[1], emissive: 0xffffff, emissiveIntensity: em,
    color: 0xffffff, roughness: rough, metalness: metal
  }), em);
}
const matGlass = facadeMat(texGlass, .25, .55, 1.0);
const matGlass2 = facadeMat(texGlass, .32, .45, .9);
const matOffice = facadeMat(texOffice, .7, .1, .85);
const matRes = facadeMat(texRes, .6, .2, .8);
const facades = [matGlass, matGlass, matGlass2, matOffice, matRes, matRes];
const matRoof = new THREE.MeshStandardMaterial({ color: 0x2c323a, roughness: .9, metalness: .2 });
const matConcrete = new THREE.MeshStandardMaterial({ color: 0x8d8f92, roughness: .82, metalness: .05 });
const matSteel = new THREE.MeshStandardMaterial({ color: 0xb9c4cf, roughness: .34, metalness: .88 });
const matDark = new THREE.MeshStandardMaterial({ color: 0x22262c, roughness: .7, metalness: .35 });
const matGround = new THREE.MeshStandardMaterial({ color: 0x8a919c, roughness: .96, metalness: 0 });
const matWall = new THREE.MeshStandardMaterial({ color: 0x6a7078, roughness: .9, metalness: .05 });
const matGrass = new THREE.MeshStandardMaterial({ color: 0x5d8f5e, roughness: 1, metalness: 0 });
const matWhite = new THREE.MeshStandardMaterial({ color: 0xe9edf2, roughness: .55, metalness: .05 });

function glowTex() {
  return canvasTex((g, w, h) => {
    const grd = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(.25, 'rgba(255,255,255,.55)');
    grd.addColorStop(.6, 'rgba(255,255,255,.12)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
  }, 128, 128);
}
const TEX_GLOW = glowTex();

function glow(color, size, opacity = 1) {
  const m = new THREE.SpriteMaterial({
    map: TEX_GLOW, color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false
  });
  reg(m, opacity);
  const s = new THREE.Sprite(m);
  s.scale.set(size, size, 1);
  return s;
}

function stripe(color, em = 2.4) {
  return reg(new THREE.MeshBasicMaterial({ color, fog: true }), em);
}
const STRIPE_WARM = stripe(0xffe0a8, 1.6);
const STRIPE_COOL = stripe(0xdff3ff, 2.6);
function instancedBoxes(mat, w, h, d, list, parent) {
  const im = new THREE.InstancedMesh(new THREE.BoxGeometry(w, h, d), mat, list.length);
  const o = new THREE.Object3D();
  list.forEach((p, i) => { o.position.set(p[0], p[1], p[2]); o.updateMatrix(); im.setMatrixAt(i, o.matrix); });
  im.instanceMatrix.needsUpdate = true;
  (parent || scene).add(im);
  return im;
}

const SKY_VERT = `
varying vec3 vDir;
void main(){
  vDir = position;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
}`;
const SKY_FRAG = `
uniform vec3 uTop; uniform vec3 uHorizon; uniform vec3 uGlow; uniform vec3 uBand;
uniform vec3 uGlowDir; uniform float uGlowPow; uniform float uGlowStr;
varying vec3 vDir;
void main(){
  vec3 d = normalize(vDir);
  float h = d.y;
  vec3 col = mix(uHorizon, uTop, pow(clamp(h,0.0,1.0), .55));
  col = mix(col * .22, col, smoothstep(-.14, .03, h));
  float g = pow(max(dot(d, normalize(uGlowDir)), 0.0), uGlowPow);
  col += uGlow * g * uGlowStr;
  col += uBand * pow(1.0 - abs(h), 14.0);
  gl_FragColor = vec4(col, 1.0);
}`;

const skyUni = {
  uTop: { value: new THREE.Color(0x04070f) },
  uHorizon: { value: new THREE.Color(0x16273d) },
  uGlow: { value: new THREE.Color(0x2b4a72) },
  uBand: { value: new THREE.Color(0x16283f) },
  uGlowDir: { value: new THREE.Vector3(-.35, .05, -.94) },
  uGlowPow: { value: 6 },
  uGlowStr: { value: .5 }
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(4600, 40, 24),
  new THREE.ShaderMaterial({
    uniforms: skyUni, vertexShader: SKY_VERT, fragmentShader: SKY_FRAG,
    side: THREE.BackSide, depthWrite: false, fog: false
  })
);
sky.frustumCulled = false;
scene.add(sky);

const hemi = new THREE.HemisphereLight(0x2b4a78, 0x070b12, .7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0x9dc0ff, .35);
sun.position.set(-1400, 900, -1800);
scene.add(sun);
scene.add(sun.target);
const ambient = new THREE.AmbientLight(0x18253c, .45);
scene.add(ambient);
const fwLight = new THREE.PointLight(0xffffff, 0, 900, 2);
fwLight.position.set(0, 300, 0);
scene.add(fwLight);

const stars = (() => {
  const N = 2600, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const u = rng() * Math.PI * 2, v = Math.pow(rng(), .6) * Math.PI * .48;
    const r = 3900;
    pos[i * 3] = r * Math.cos(u) * Math.sin(v + .05);
    pos[i * 3 + 1] = r * Math.cos(v);
    pos[i * 3 + 2] = r * Math.sin(u) * Math.sin(v + .05);
    const w = .6 + rng() * .4, tint = rng();
    col[i * 3] = w * (tint > .8 ? .8 : 1);
    col[i * 3 + 1] = w * .96;
    col[i * 3 + 2] = w * (tint < .2 ? .82 : 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({
    size: 2.3, sizeAttenuation: false, vertexColors: true,
    transparent: true, opacity: .8, depthWrite: false, fog: false
  });
  const p = new THREE.Points(g, m);
  p.frustumCulled = false;
  scene.add(p);
  return p;
})();

const moon = new THREE.Group();
{
  const ball = new THREE.Mesh(new THREE.SphereGeometry(34, 24, 18),
    new THREE.MeshBasicMaterial({ color: 0xf2f6ff, fog: false }));
  const halo = glow(0xa9c8ff, 300, .35);
  moon.add(ball, halo);
  moon.position.set(-1500, 900, -1900);
  scene.add(moon);
}

function waterNormalTex(size = 128) {
  const TAU = Math.PI * 2;
  const waves = [];
  for (let k = 0; k < 11; k++) {
    waves.push({
      i: rndi(-4, 4) || 1, j: rndi(-4, 4) || 2,
      a: (k === 0 ? 1.5 : rnd(.3, 1.1)) / (1 + k * .25), p: rng() * TAU
    });
  }
  const H = (x, y) => {
    let s = 0;
    for (const w of waves) s += w.a * Math.sin(TAU * (w.i * x + w.j * y) / size + w.p);
    return s;
  };
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const dx = (H((x + 1) % size, y) - H((x - 1 + size) % size, y)) * .5;
      const dy = (H(x, (y + 1) % size) - H(x, (y - 1 + size) % size)) * .5;
      let nx = -dx, ny = -dy, nz = 1.1;
      const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
      const o = (y * size + x) * 4;
      img.data[o] = (nx * .5 + .5) * 255;
      img.data[o + 1] = (ny * .5 + .5) * 255;
      img.data[o + 2] = (nz * .5 + .5) * 255;
      img.data[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = true;
  return t;
}

const water = new Water(new THREE.PlaneGeometry(5200, 5200), {
  textureWidth: 1024, textureHeight: 1024, clipBias: .04,
  waterNormals: waterNormalTex(), sunDirection: new THREE.Vector3(-.45, .5, -.76).normalize(),
  sunColor: 0xa9c8ff, waterColor: 0x061019, distortionScale: 5, fog: true, alpha: 1
});
water.rotation.x = -Math.PI / 2;
water.material.uniforms.size.value = 2.2;
water.material.onBeforeCompile = sh => {
  sh.fragmentShader = sh.fragmentShader.replace('float rf0 = 0.3;', 'float rf0 = 0.075;');
};
scene.add(water);

function ensureCCW(p) {
  let a = 0;
  for (let i = 0; i < p.length; i++) {
    const q = p[(i + 1) % p.length];
    a += p[i][0] * q[1] - q[0] * p[i][1];
  }
  return a < 0 ? p.slice().reverse() : p;
}

function extrudeFlat(pts, depth, bevel = 0, seg = 6) {
  const p = ensureCCW(pts.map(([x, z]) => [x, -z]));
  const s = new THREE.Shape();
  s.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length; i++) s.lineTo(p[i][0], p[i][1]);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, {
    depth, bevelEnabled: bevel > 0, bevelSize: bevel, bevelThickness: bevel,
    bevelSegments: 2, curveSegments: seg, steps: 1
  });
  geo.rotateX(-Math.PI / 2);
  return geo;
}

function land(pts, topMat = matGround, wallMat = matWall) {
  const geo = extrudeFlat(pts, 10);
  geo.translate(0, LAND_TOP - 10, 0);
  const m = new THREE.Mesh(geo, [topMat, wallMat]);
  m.receiveShadow = false;
  scene.add(m);
  return m;
}

const WORLD_UP = new THREE.Vector3(0, 1, 0);
function sweep(curve, section, seg) {
  const pts = curve.getSpacedPoints(seg);
  const pos = [], uv = [], idx = [];
  const n = section.length;
  const R = new THREE.Vector3(), U = new THREE.Vector3(), T = new THREE.Vector3();
  for (let i = 0; i <= seg; i++) {
    const P = pts[i];
    curve.getTangentAt(i / seg, T);
    R.crossVectors(T, WORLD_UP).normalize();
    U.crossVectors(R, T).normalize();
    for (let j = 0; j < n; j++) {
      const sx = section[j][0], sy = section[j][1];
      pos.push(P.x + R.x * sx + U.x * sy, P.y + R.y * sx + U.y * sy, P.z + R.z * sx + U.z * sy);
      uv.push(i / seg, j / (n - 1));
    }
  }
  for (let i = 0; i < seg; i++) for (let j = 0; j < n - 1; j++) {
    const a = i * n + j, b = a + n;
    idx.push(a, b, a + 1, a + 1, b, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function sideAt(curve, t, dist, out) {
  const T = curve.getTangentAt(t, new THREE.Vector3());
  return out.set(-T.z, 0, T.x).normalize().multiplyScalar(dist);
}

function bridge(pts, width, thick, arch, opts = {}) {

  const g = new THREE.Group();
  const sec = [[-width / 2, -thick / 2], [width / 2, -thick / 2], [width / 2, thick / 2], [-width / 2, thick / 2], [-width / 2, -thick / 2]];
  g.add(new THREE.Mesh(sweep(curve, sec, 90), matConcrete));
  if (opts.rail !== false) {
    const N = 70, sp = curve.getSpacedPoints(N), v = new THREE.Vector3();
    for (const s of [-1, 1]) {
      const railPts = [];
      for (let i = 0; i <= N; i++) {

        railPts.push(new THREE.Vector3(sp[i].x + v.x, sp[i].y + 2.4, sp[i].z + v.z));

        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(railPts), 90, .35, 5, false),
        opts.railMat || matSteel));

  return { group: g, curve };
}

const fireworks = [];
const fwColors = [0xff6b8a, 0xffd166, 0x63d3ff, 0x9dff8a, 0xc79dff, 0xffffff, 0xff9a4d];
function launchFirework(x, y, z, color) {
  const N = 260;
  const pos = new Float32Array(N * 3), vel = new Float32Array(N * 3);
  const shell = rng() < .3;
  for (let i = 0; i < N; i++) {
    let vx, vy, vz;
    if (shell) {
      const a = rng() * Math.PI * 2;
      vx = Math.cos(a); vy = rnd(-.15, .15); vz = Math.sin(a);
    } else {
      const u = rng() * Math.PI * 2, c = rng() * 2 - 1, s = Math.sqrt(1 - c * c);
      vx = s * Math.cos(u); vy = c; vz = s * Math.sin(u);
    }
    const sp = shell ? rnd(38, 44) : rnd(16, 46);
    vel[i * 3] = vx * sp; vel[i * 3 + 1] = vy * sp; vel[i * 3 + 2] = vz * sp;
    pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    size: 5.2, map: TEX_GLOW, color, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true, fog: false
  });
  const p = new THREE.Points(g, m);
  p.frustumCulled = false;
  scene.add(p);
  fireworks.push({ p, vel, life: 0, max: rnd(2.2, 3.4), pos: new THREE.Vector3(x, y, z), color });
  fwLight.position.set(x, y, z);
  fwLight.color.set(color);
  fwLight.intensity = 3.2;
}
let fwTimer = 2;
function updateFireworks(dt) {
  for (let i = fireworks.length - 1; i >= 0; i--) {
    const f = fireworks[i];
    f.life += dt;
    const pos = f.p.geometry.attributes.position;
    const drag = Math.pow(.24, dt), g = 17 * dt;
    for (let k = 0; k < f.vel.length; k += 3) {
      f.vel[k] *= drag; f.vel[k + 1] = f.vel[k + 1] * drag - g; f.vel[k + 2] *= drag;
      pos.array[k] += f.vel[k] * dt;
      pos.array[k + 1] += f.vel[k + 1] * dt;
      pos.array[k + 2] += f.vel[k + 2] * dt;
    }
    pos.needsUpdate = true;
    const t = f.life / f.max;
    f.p.material.opacity = Math.max(0, 1 - t * t) * .95;
    f.p.material.size = 5.2 * (1 - t * .45);
    if (f.life >= f.max) {
      scene.remove(f.p);
      f.p.geometry.dispose();
      f.p.material.dispose();
      fireworks.splice(i, 1);
    }
  }
  fwLight.intensity = Math.max(0, fwLight.intensity - dt * 4.5);
}

const _obr = water.onBeforeRender;
water.onBeforeRender = function (r, s, c) {
  const hidden = [];
  const hide = o => { if (o && o.visible) { hidden.push(o); o.visible = false; } };
  hide(stars);
  for (const b of beams) hide(b.az);
  for (const f of fireworks) hide(f.p);
  _obr.call(this, r, s, c);
  for (const o of hidden) o.visible = true;
};

const COLKEYS = ['skyTop', 'skyHorizon', 'glow', 'band', 'fog', 'sun', 'hemiSky', 'hemiGround', 'amb', 'water', 'waterSun'];
const NUMKEYS = ['glowPow', 'glowStr', 'fogNear', 'fogFar', 'sunInt', 'hemiInt', 'ambInt', 'em', 'stars', 'beams', 'exposure', 'bloomStr', 'moon'];
const cur = { glowDir: new THREE.Vector3(), sunDir: new THREE.Vector3() };
const tgt = { dir: new THREE.Vector3(), glowDir: new THREE.Vector3() };
for (const k of COLKEYS) { cur[k] = new THREE.Color(); tgt[k] = new THREE.Color(); }
for (const k of NUMKEYS) { cur[k] = 0; tgt[k] = 0; }

function setMode(name) {
  const m = MODES[name];
  for (const k of COLKEYS) tgt[k].set(m[k]);
  for (const k of NUMKEYS) tgt[k] = m[k];
  tgt.dir.set(...m.sunDir).normalize();
  tgt.glowDir.set(...m.glowDir).normalize();
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === name));
}
function snapMode(name) {
  setMode(name);
  for (const k of COLKEYS) cur[k].copy(tgt[k]);
  for (const k of NUMKEYS) cur[k] = tgt[k];
  cur.sunDir.copy(tgt.dir);
  cur.glowDir.copy(tgt.glowDir);
  applyMode(1);
}
function applyMode(k) {
  for (const key of COLKEYS) cur[key].lerp(tgt[key], k);
  for (const key of NUMKEYS) cur[key] += (tgt[key] - cur[key]) * k;
  cur.sunDir.lerp(tgt.dir, k).normalize();
  cur.glowDir.lerp(tgt.glowDir, k).normalize();

  skyUni.uTop.value.copy(cur.skyTop);
  skyUni.uHorizon.value.copy(cur.skyHorizon);
  skyUni.uGlow.value.copy(cur.glow);
  skyUni.uBand.value.copy(cur.band);
  skyUni.uGlowDir.value.copy(cur.glowDir);
  skyUni.uGlowPow.value = cur.glowPow;
  skyUni.uGlowStr.value = cur.glowStr;

  scene.fog.color.copy(cur.fog);
  scene.fog.near = cur.fogNear;
  scene.fog.far = cur.fogFar;
  water.material.uniforms.fogColor.value.copy(cur.fog);
  water.material.uniforms.fogNear.value = cur.fogNear;
  water.material.uniforms.fogFar.value = cur.fogFar;

  sun.color.copy(cur.sun);
  sun.intensity = cur.sunInt;
  sun.position.copy(cur.sunDir).multiplyScalar(2600);
  hemi.color.copy(cur.hemiSky);
  hemi.groundColor.copy(cur.hemiGround);
  hemi.intensity = cur.hemiInt;
  ambient.color.copy(cur.amb);
  ambient.intensity = cur.ambInt;
  water.material.uniforms.waterColor.value.copy(cur.water);
  water.material.uniforms.sunColor.value.copy(cur.waterSun);
  water.material.uniforms.sunDirection.value.copy(cur.sunDir);
  renderer.toneMappingExposure = cur.exposure;
  bloom.strength = cur.bloomStr;
  stars.material.opacity = cur.stars;
  stars.visible = cur.stars > .02;
  moon.visible = cur.moon > .04;

  for (const n of nightMats) {
    if (n.kind === 'emissive') n.mat.emissiveIntensity = n.base * cur.em;
    else if (n.kind === 'opacity') n.mat.opacity = n.base * cur.em;
    else n.mat.color.copy(n.baseColor).multiplyScalar(cur.em);
  }
}
snapMode('night');

const _pv = new THREE.Vector3();
function updateLabels() {
  if (!labelsOn) return;
  const w = window.innerWidth, h = window.innerHeight;
  for (const L of LABELS) {
    _pv.copy(L.v).project(camera);
    const vis = _pv.z < 1 && _pv.x > -1.2 && _pv.x < 1.2 && _pv.y > -1.2 && _pv.y < 1.2;
    const dist = camera.position.distanceTo(L.v);
    const fade = clamp(1 - (dist - 200) / 1900, 0, 1);
    if (!vis || fade <= .02) { L.el.style.opacity = 0; continue; }
    L.el.style.opacity = (fade * .95).toFixed(2);
    L.el.style.transform = `translate(${(_pv.x * .5 + .5) * w}px, ${(-_pv.y * .5 + .5) * h}px) translate(-50%,-50%)`;
  }
}

let tourOn = false, tourIdx = 0, tourTimer = 0;
const tourOrder = ['bay', 'mbs', 'flyer', 'gardens', 'merlion', 'aerial'];

  bloom.setSize(window.innerWidth, window.innerHeight);

const statsEl = document.getElementById('stats');
const clock = new THREE.Clock();
let statTimer = 0, frames = 0, fps = 0, lastNow = performance.now();
let started = false;

flyTo(VIEWS.bay.pos, VIEWS.bay.tgt, 6);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .1);
  const t = clock.elapsedTime;
  const now = performance.now();
  const realDt = Math.min((now - lastNow) / 1000, 1);
  lastNow = now;
  renderer.info.reset();

  applyMode(1 - Math.exp(-dt * 2.2));

  water.material.uniforms.time.value += dt * .55;

  wheel.rotation.z -= dt * .055;
  for (const c of capsules) c.rotation.z = -wheel.rotation.z;
  rimMat.color.setHSL((t * .03) % 1, .5, .5);
  rimMat.color.multiplyScalar(.25 + .75 * cur.em);

  for (const r of roads) r.tex.offset.x -= r.speed * dt;

  for (const b of boats) {
    b.t = (b.t + dt * b.speed) % 1;
    const p = b.curve.getPoint(b.t);
    const n = b.curve.getPoint((b.t + .01) % 1);
    b.g.position.copy(p);
    b.g.lookAt(n.x, p.y, n.z);
    b.g.rotation.z = Math.sin(t * .9 + b.t * 20) * .02;
    b.g.rotation.x = Math.sin(t * .7 + b.t * 14) * .015;
  }

  for (const b of beams) {
    b.az.rotation.y += b.spd * dt;
    b.ti.rotation.x = b.tilt + Math.sin(t * .35 + b.phase) * b.amp;
    b.az.children[0].children[0].material.opacity = cur.beams * (.035 + .02 * Math.sin(t * 1.4 + b.phase));
  }
  if (beaconPoints) beaconPoints.material.opacity = cur.em * (.4 + .6 * Math.abs(Math.sin(t * 1.8)));

  if (fxOn && cur.em > .3) {
    fwTimer -= dt;
    if (fwTimer <= 0) {
      fwTimer = rnd(3.4, 7.5);
      const n = rndi(1, 3);
      for (let i = 0; i < n; i++) {
        launchFirework(rnd(-420, 420), rnd(200, 400), rnd(-220, 420), pick(fwColors));
      }
    }
  }
  updateFireworks(dt);

  if (tween) {
    tween.t += dt;
    const k = ease(clamp(tween.t / tween.dur, 0, 1));
    camera.position.lerpVectors(tween.p0, tween.p1, k);
    controls.target.lerpVectors(tween.q0, tween.q1, k);
    if (k >= 1) { tween = null; controls.enabled = true; }
  } else if (tourOn) {
    tourTimer += dt;
    if (tourTimer > 14) {
      tourTimer = 0;
      tourIdx = (tourIdx + 1) % tourOrder.length;
      goView(tourOrder[tourIdx], 5.5);
    }
  }

  if (camera.position.y < 7) camera.position.y = 7;
  controls.update();
  updateLabels();
  composer.render();

  frames++;
  statTimer += realDt;
  if (statTimer > .5) {
    fps = Math.round(frames / statTimer);
    frames = 0; statTimer = 0;
    statsEl.textContent = `${fps} fps · ${renderer.info.render.triangles.toLocaleString()} tris · ${renderer.info.render.calls} draws`;
  }
  if (!started) {
    started = true;
    requestAnimationFrame(() => document.getElementById('boot').classList.add('gone'));
  }
}
animate();
