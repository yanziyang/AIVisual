<!DOCTYPE html>
<html lang="en">
<head>
<script id="aiVisualRenderingBridge">
(function () {
  "use strict";

  var originalGetContext = HTMLCanvasElement.prototype.getContext;
  var badge = null;
  var currentState = "checking";
  var currentLabel = "Checking GPU/CPU renderer…";
  var currentDetails = "The page requests high-performance WebGL and allows the browser software renderer when hardware acceleration is unavailable.";
  var successfulContexts = 0;
  var observedContexts = new WeakSet();
  var failureTimer = 0;
  var softwareRenderer = /swiftshader|llvmpipe|softpipe|software renderer|software rasterizer|basic render driver|warp/i;
  var hardwareRenderer = /nvidia|geforce|quadro|radeon|amd|intel.*(graphics|arc|iris|uhd|hd graphics)|apple gpu|apple m[1-9]|adreno|mali|powervr|qualcomm/i;

  function attachBadge() {
    if (badge || !document.body) return;
    badge = document.createElement("div");
    badge.id = "aiVisualRenderingStatus";
    badge.setAttribute("role", "status");
    badge.setAttribute("aria-live", "polite");
    badge.title = "Automatic browser-selected WebGL. This 3D page has no separate CPU scene renderer; known software WebGL is reported as CPU only.";
    badge.style.cssText = [
      "position:fixed", "right:10px", "bottom:10px", "z-index:2147483647",
      "max-width:calc(100vw - 20px)", "padding:6px 9px", "border-radius:999px",
      "font:11px/1.3 system-ui,sans-serif", "letter-spacing:.02em",
      "color:#f7f8fa", "background:rgba(18,22,28,.82)",
      "box-shadow:0 2px 10px rgba(0,0,0,.22)", "pointer-events:none",
      "backdrop-filter:blur(8px)", "-webkit-backdrop-filter:blur(8px)"
    ].join(";");
    document.body.appendChild(badge);
    badge.textContent = currentLabel;
    badge.title = currentDetails || badge.title;
    paintBadge();
  }

  function paintBadge() {
    attachBadge();
    if (!badge) return;
    badge.dataset.renderingState = currentState;
    if (currentState === "gpu") badge.style.background = "rgba(14,105,72,.9)";
    else if (currentState === "cpu") badge.style.background = "rgba(143,83,13,.92)";
    else if (currentState === "unavailable") badge.style.background = "rgba(145,39,39,.92)";
    else badge.style.background = "rgba(18,22,28,.82)";
  }

  function setStatus(state, label, details) {
    currentState = state;
    currentLabel = label;
    currentDetails = details || currentDetails;
    attachBadge();
    if (!badge) return;
    badge.textContent = label;
    if (details) badge.title = details;
    paintBadge();
  }

  function getRendererName(gl) {
    try {
      var debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
      if (!debugInfo) return "";
      return String(gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || "").trim();
    } catch (_) {
      return "";
    }
  }

  function classify(gl) {
    var renderer = getRendererName(gl);
    if (!renderer) {
      setStatus("unknown", "GPU/CPU unknown · renderer identity masked",
        "WebGL is active, but this browser does not expose renderer identity.");
      return;
    }
    if (softwareRenderer.test(renderer)) {
      var softwareName = renderer.length > 48 ? renderer.slice(0, 45) + "…" : renderer;
      setStatus("cpu", "CPU only · software WebGL · " + softwareName,
        "The WebGL renderer identifies itself as software rendering: " + renderer);
      return;
    }
    if (hardwareRenderer.test(renderer)) {
      var hardwareName = renderer.length > 54 ? renderer.slice(0, 51) + "…" : renderer;
      setStatus("gpu", "GPU active · " + hardwareName,
        "The WebGL renderer identifies GPU hardware: " + renderer + ". The webpage cannot independently verify which physical device executed each frame.");
      return;
    }
    setStatus("unknown", "GPU/CPU unknown · renderer identity inconclusive",
      "WebGL is active, but its renderer string does not identify known GPU hardware or a known software renderer: " + renderer);
  }

  function observeContext(gl, canvas) {
    if (observedContexts.has(gl)) return;
    observedContexts.add(gl);
    successfulContexts += 1;
    if (failureTimer) window.clearTimeout(failureTimer);
    classify(gl);
    canvas.addEventListener("webglcontextlost", function (event) {
      event.preventDefault();
      successfulContexts = Math.max(0, successfulContexts - 1);
      if (!successfulContexts) {
        setStatus("unavailable", "3D unavailable · WebGL context lost",
          "The page has no active WebGL context after a context-loss event.");
      }
    }, false);
    canvas.addEventListener("webglcontextrestored", function () {
      successfulContexts += 1;
      classify(gl);
    }, false);
  }

  function isWebGLType(type) {
    return /^(webgl2?|experimental-webgl)$/i.test(String(type || ""));
  }

  HTMLCanvasElement.prototype.getContext = function (type, attributes) {
    if (!isWebGLType(type)) return originalGetContext.apply(this, arguments);

    var args = Array.prototype.slice.call(arguments);
    var options = {};
    if (attributes && typeof attributes === "object") {
      Object.keys(attributes).forEach(function (key) { options[key] = attributes[key]; });
    }
    options.powerPreference = "high-performance";
    options.failIfMajorPerformanceCaveat = false;
    args[1] = options;

    var gl;
    try {
      gl = originalGetContext.apply(this, args);
    } catch (error) {
      if (!successfulContexts) {
        setStatus("unavailable", "3D unavailable · WebGL initialization failed",
          "The browser threw while creating a WebGL context: " + (error && error.message ? error.message : String(error)));
      }
      throw error;
    }
    if (gl) {
      observeContext(gl, this);
    } else if (!successfulContexts) {
      setStatus("checking", "WebGL unavailable · browser fallback pending",
        "The first WebGL context request failed; the page may try another supported WebGL version.");
      if (failureTimer) window.clearTimeout(failureTimer);
      failureTimer = window.setTimeout(function () {
        if (!successfulContexts) {
          setStatus("unavailable", "3D unavailable · WebGL context could not be created",
            "Neither hardware-accelerated nor software WebGL is available to this page.");
        }
      }, 1800);
    }
    return gl;
  };

  setStatus("checking", "Checking GPU/CPU renderer…",
    "The page requests high-performance WebGL and allows the browser's software renderer when hardware acceleration is unavailable.");
  document.addEventListener("DOMContentLoaded", function () {
    attachBadge();
    window.setTimeout(function () {
      if (currentState === "checking") {
        setStatus("unavailable", "3D unavailable · renderer did not initialize",
          "No WebGL context was created. The page may be unsupported or its 3D scripts may not have loaded.");
      }
    }, 12000);
  }, { once: true });
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eiffel Tower — 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1526; }
  #app { position: fixed; inset: 0; }
  #hud {
    position: fixed; left: 16px; top: 14px; color: #e8eef8;
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; user-select: none;
  }
  #hud h1 { margin: 0 0 2px; font-size: 17px; font-weight: 600; letter-spacing: .3px; }
  #hud small { opacity: .75; }
  #bar {
    position: fixed; right: 16px; top: 14px; display: flex; gap: 8px;
    font: 12px "Segoe UI", system-ui, sans-serif;
  }
  #bar button {
    background: rgba(16,26,44,.72); color: #dfe8f5; border: 1px solid rgba(255,255,255,.18);
    border-radius: 7px; padding: 7px 12px; cursor: pointer; backdrop-filter: blur(4px);
  }
  #bar button:hover { background: rgba(30,45,72,.85); }
  #load {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0b1526; color: #cfe0f5; font: 14px "Segoe UI", system-ui, sans-serif;
    transition: opacity .5s; z-index: 10;
  }
  #load.gone { opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>La Tour Eiffel</h1>
  <small>drag to orbit &middot; scroll to zoom &middot; right-drag to pan</small>
</div>
<div id="bar">
  <button id="btnRotate">Pause spin</button>
  <button id="btnReset">Reset view</button>
</div>
<div id="load">Loading model&hellip;</div>
<script id="glbdata" type="application/octet-stream"><!--GLB_BASE64--></script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const loadEl = document.getElementById('load');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb6c8d9, 900, 5200);

const skyGeo = new THREE.SphereGeometry(4200, 32, 18);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    top: { value: new THREE.Color(0x1d3a67) },
    mid: { value: new THREE.Color(0x5e87b8) },
    bot: { value: new THREE.Color(0xb9cbdc) }
  },
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: [
    'varying vec3 vP; uniform vec3 top; uniform vec3 mid; uniform vec3 bot;',
    'void main(){',
    '  float h = clamp(normalize(vP).y, -1.0, 1.0);',
    '  vec3 c = h > 0.12 ? mix(mid, top, clamp((h-0.12)/0.75, 0.0, 1.0))',
    '                     : mix(bot, mid, clamp((h+0.15)/0.27, 0.0, 1.0));',
    '  gl_FragColor = vec4(c, 1.0);',
    '}'
  ].join('\n')
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.5, 9000);
camera.position.set(230, 150, 470);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 135, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 40;
controls.maxDistance = 1800;
controls.maxPolarAngle = Math.PI * 0.497;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

const sun = new THREE.DirectionalLight(0xfff2de, 3.2);
sun.position.set(-390, 640, 650);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -300; sun.shadow.camera.right = 300;
sun.shadow.camera.top = 420; sun.shadow.camera.bottom = -60;
sun.shadow.camera.near = 100; sun.shadow.camera.far = 2200;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.6;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x9dbbdd, 0x5a6b45, 0.75));

const draco = new DRACOLoader();
draco.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

const b64 = document.getElementById('glbdata').textContent.trim();
const bin = atob(b64);
const bytes = new Uint8Array(bin.length);
for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

loader.parse(bytes.buffer, '', (gltf) => {
  const root = gltf.scene;
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.receiveShadow = true;
    const n = (o.name || '') + (o.material && o.material.name ? o.material.name : '');
    if (/Grass|Plaza|Context|Foliage2$|Roof/i.test(n) && !/Trunk/i.test(n)) o.castShadow = false;
    if (o.material && o.material.name === 'EiffelPaintExport') {
      o.material.vertexColors = true;
    }
  });
  scene.add(root);
  loadEl.classList.add('gone');
}, (e) => {
  loadEl.textContent = 'Failed to load model: ' + e;
});

document.getElementById('btnRotate').addEventListener('click', (e) => {
  controls.autoRotate = !controls.autoRotate;
  e.target.textContent = controls.autoRotate ? 'Pause spin' : 'Resume spin';
});
document.getElementById('btnReset').addEventListener('click', () => {
  camera.position.set(230, 150, 470);
  controls.target.set(0, 135, 0);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
