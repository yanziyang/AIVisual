<div id="vignette"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------------------------------- utils --------------------------------- */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260918);
const rand = (min, max) => min + rng() * (max - min);
const UP = new THREE.Vector3(0, 1, 0);

/* -------------------------------- renderer -------------------------------- */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1226, 0.00105);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.5, 3000);
camera.position.set(215, 145, 290);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-25, 20, -45);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.minDistance = 70;
controls.maxDistance = 620;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = 1.52;

/* --------------------------------- lighting ------------------------------- */

const SUN_DIR = new THREE.Vector3(-0.55, 0.18, -0.72).normalize();

scene.add(new THREE.HemisphereLight(0x2b4168, 0x070a12, 0.6));

const sun = new THREE.DirectionalLight(0xff8a4a, 2.1);
sun.position.copy(SUN_DIR).multiplyScalar(420);
scene.add(sun);

const fill = new THREE.DirectionalLight(0x6fa4ff, 0.45);
fill.position.set(260, 180, 220);
scene.add(fill);

/* ------------------------------------ sky --------------------------------- */

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  fog: false,
  uniforms: {
    top:    { value: new THREE.Color(0x040817) },
    mid:    { value: new THREE.Color(0x2c1c52) },
    bot:    { value: new THREE.Color(0xff7a3c) },
    sunDir: { value: SUN_DIR.clone() }
  },
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 top, mid, bot, sunDir;
    varying vec3 vDir;
    void main() {
      vec3 d = normalize(vDir);
      float h = clamp(d.y, 0.0, 1.0);
      vec3 col = mix(bot, mid, smoothstep(0.0, 0.22, h));
      col = mix(col, top, smoothstep(0.10, 0.72, h));
      float s = max(dot(d, normalize(sunDir)), 0.0);
      col += vec3(1.0, 0.42, 0.16) * pow(s, 48.0) * 1.1;
      col += vec3(0.95, 0.28, 0.35) * pow(s, 7.0) * 0.16;
      gl_FragColor = vec4(col, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1200, 40, 20), skyMat));

const starCount = 750;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const az = rand(0, Math.PI * 2);
  const el = Math.asin(rand(0.06, 1));
  const r = 1100;
  starPos[i * 3]     = Math.cos(az) * Math.cos(el) * r;
  starPos[i * 3 + 1] = Math.sin(el) * r;
  starPos[i * 3 + 2] = Math.sin(az) * Math.cos(el) * r;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
  color: 0xbcd4ff, size: 1.6, sizeAttenuation: false,
  transparent: true, opacity: 0.75, fog: false, depthWrite: false
})));

/* ----------------------------------- water -------------------------------- */

const reflector = new Reflector(new THREE.PlaneGeometry(2200, 2200), {
  clipBias: 0.004,
  textureWidth: 1024,
  textureHeight: 1024,
  color: 0x8fa4c0
});
reflector.rotation.x = -Math.PI / 2;
scene.add(reflector);

const waterTint = new THREE.Mesh(
  new THREE.PlaneGeometry(2200, 2200),
  new THREE.MeshBasicMaterial({ color: 0x06182b, transparent: true, opacity: 0.44, depthWrite: false })
);
waterTint.rotation.x = -Math.PI / 2;
waterTint.position.y = 0.06;
scene.add(waterTint);

/* ----------------------------------- land --------------------------------- */

const landMat = new THREE.MeshStandardMaterial({ color: 0x0d131d, roughness: 0.95, metalness: 0.0 });
const walkMat = new THREE.MeshStandardMaterial({ color: 0x232c3d, roughness: 0.85, metalness: 0.05 });

function slab(x, z, w, d, h = 2, mat = landMat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, h / 2, z);
  scene.add(m);
  return m;
}

slab(-320, -40, 550, 460);   // MBS / gardens bank (west shore)
slab(280, -40, 470, 460);    // CBD bank           (east shore)
slab(0, -190, 90, 90);       // far bank, closes the bay

// promenades along the water
slab(-42, -40, 7, 380, 2.4, walkMat);
slab(42, -40, 7, 380, 2.4, walkMat);
slab(0, -143, 86, 7, 2.4, walkMat);

/* ------------------------------- window textures -------------------------- */

const WINDOW_COLORS = [[255, 213, 148], [255, 236, 202], [204, 226, 255], [158, 208, 255], [255, 245, 214]];

function makeWindowTexture(seed, cols, rows, lit) {
  const r = mulberry32(seed);
  const px = 8;
  const c = document.createElement('canvas');
  c.width = cols * px;
  c.height = rows * px;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#03050a';
  ctx.fillRect(0, 0, c.width, c.height);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const roll = r();
      if (roll < lit) {
        const p = WINDOW_COLORS[(r() * WINDOW_COLORS.length) | 0];
        const a = 0.35 + r() * 0.65;
        ctx.fillStyle = `rgba(${p[0]},${p[1]},${p[2]},${a.toFixed(2)})`;
        ctx.fillRect(x * px + 1.5, y * px + 1.5, px - 3, px - 4);
      } else if (roll < lit + 0.16) {
        ctx.fillStyle = 'rgba(70,100,140,0.22)';
        ctx.fillRect(x * px + 1.5, y * px + 1.5, px - 3, px - 4);
      }
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

const baseTextures = [0, 1, 2, 3].map(i => makeWindowTexture(9100 + i * 137, 2, 4, 0.42 + i * 0.07));
let texCursor = 0;

function windowMaterial(w, h, repeatX = 7, repeatY = 6, tint = 0xffffff, intensity = 1.15) {
  const tex = baseTextures[texCursor++ % baseTextures.length].clone();
  tex.needsUpdate = true;
  tex.repeat.set(Math.max(2, Math.round(w / repeatX)), Math.max(3, Math.round(h / repeatY)));
  return new THREE.MeshStandardMaterial({
    map: tex, emissiveMap: tex, emissive: new THREE.Color(tint),
    emissiveIntensity: intensity, color: 0xffffff, roughness: 0.55, metalness: 0.3
  });
}

const solidMat = new THREE.MeshStandardMaterial({ color: 0x121a29, roughness: 0.8, metalness: 0.25 });
const concreteMat = new THREE.MeshStandardMaterial({ color: 0xb9c4d1, roughness: 0.6, metalness: 0.15 });
const trimMat = new THREE.MeshStandardMaterial({ color: 0x9fb2c9, roughness: 0.45, metalness: 0.7 });
const blinkers = [];

/* ------------------------------ skyline builder --------------------------- */

function crown(mesh, w, d, h, style) {
  if (style === 'pyramid') {
    const ch = h * 0.13;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.62, ch, 4), solidMat);
    cone.rotation.y = Math.PI / 4;
    cone.position.set(mesh.position.x, 2 + h + ch / 2, mesh.position.z);
    scene.add(cone);
  } else if (style === 'antenna') {
    const ah = 10 + h * 0.06;
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, ah, 6), trimMat);
    pole.position.set(mesh.position.x, 2 + h + ah / 2, mesh.position.z);
    scene.add(pole);
    const lamp = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xff2b2b })
    );
    lamp.position.set(mesh.position.x, 2 + h + ah, mesh.position.z);
    scene.add(lamp);
    blinkers.push({ mat: lamp.material, phase: rand(0, Math.PI * 2) });
  } else if (style === 'setback') {
    const bh = h * 0.22;
    const top = new THREE.Mesh(new THREE.BoxGeometry(w * 0.62, bh, d * 0.62), windowMaterial(w * 0.62, bh));
    top.position.set(mesh.position.x, 2 + h + bh / 2, mesh.position.z);
    scene.add(top);
  }
}

function building(x, z, w, d, h, style = null) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), windowMaterial(w, h));
  m.position.set(x, 2 + h / 2, z);
  scene.add(m);
  if (!style) {
    const r = rng();
    style = r < 0.16 ? 'pyramid' : r < 0.32 ? 'antenna' : r < 0.5 ? 'setback' : null;
  }
  if (style) crown(m, w, d, h, style);
  return m;
}

// footprints kept clear of the hand-placed landmarks
const RESERVED = [
  [75, -100, 30], [95, -130, 32], [140, -70, 34], [150, -10, 32], [135, 20, 32],
  [60, 5, 75], [54, 78, 36]
];

// CBD cluster on the right bank, peaking mid-bay
for (let ix = 0; ix < 7; ix++) {
  for (let iz = 0; iz < 7; iz++) {
    if (rng() < 0.18) continue;
    const x = 64 + ix * 28 + rand(-5, 5);
    const z = -140 + iz * 33 + rand(-6, 6);
    if (RESERVED.some(([rx, rz, rr]) => Math.hypot(x - rx, z - rz) < rr)) continue;
    const dx = (x - 132) / 62, dz = (z + 52) / 78;
    const ridge = Math.exp(-(dx * dx + dz * dz));
    const h = 18 + 105 * ridge * rand(0.55, 1.25);
    const w = rand(12, 24), d = rand(12, 24);
    building(x, z, w, d, h);
  }
}

// heroes around the skyline peak
building(75, -100, 26, 26, 62, 'setback');
building(95, -130, 28, 28, 118, 'pyramid');
building(140, -70, 30, 30, 132, 'antenna');
building(150, -10, 28, 28, 96, 'pyramid');
building(135, 20, 28, 28, 78, 'setback');

// low-rise on the west bank promenade
for (let i = 0; i < 5; i++) {
  building(-70 + rand(-6, 6), 105 + i * 22, rand(10, 14), rand(10, 16), rand(8, 15));
}

/* ---------------------------- Marina Bay Sands ---------------------------- */

const mbs = new THREE.Group();
mbs.position.set(-70, 0, 0);
scene.add(mbs);

const towerMats = [
  windowMaterial(30, 74, 6.5, 7, 0xffe2b0, 1.0),
  windowMaterial(30, 74, 6.5, 7, 0xffcf96, 1.05),
  windowMaterial(30, 74, 6.5, 7, 0xfff0d2, 0.95)
];
const towerLayout = [[-40, -3, 0], [0, 0, 1], [40, 3, 2]];

for (const [tz, tx, mi] of towerLayout) {
  const geo = new THREE.BoxGeometry(16, 74, 24, 1, 22, 1);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const t = (y + 37) / 74;
    const taper = 1 - 0.26 * Math.pow(t, 1.7);
    pos.setZ(i, pos.getZ(i) * taper);
    pos.setX(i, pos.getX(i) * (1 - 0.1 * Math.pow(t, 1.7)));
  }
  geo.computeVertexNormals();
  const tower = new THREE.Mesh(geo, towerMats[mi]);
  tower.position.set(tx, 2 + 37, tz);
  mbs.add(tower);
}

// SkyPark: boat-hull profile, cantilevered over the bay end
{
  const s = new THREE.Shape();
  s.moveTo(62, 0);
  s.lineTo(-70, 0);
  s.quadraticCurveTo(-92, 0.2, -100, 3.4);
  s.quadraticCurveTo(-98, 6.2, -91, 6.6);
  s.lineTo(62, 6.6);
  s.lineTo(62, 0);
  const geo = new THREE.ExtrudeGeometry(s, { depth: 26, bevelEnabled: false });
  geo.translate(0, 0, -13);
  const deck = new THREE.Mesh(geo, concreteMat);
  deck.rotation.y = Math.PI / 2;
  deck.position.y = 76;
  mbs.add(deck);

  // rooftop gardens
  const garden = new THREE.Mesh(
    new THREE.BoxGeometry(16, 1.6, 118),
    new THREE.MeshStandardMaterial({ color: 0x0c2917, roughness: 0.9, emissive: 0x061a0e, emissiveIntensity: 0.7 })
  );
  garden.position.set(-1, 83.4, 3);
  mbs.add(garden);

  // infinity pool along the bay-facing edge
  const pool = new THREE.Mesh(
    new THREE.BoxGeometry(1.1, 0.45, 96),
    new THREE.MeshBasicMaterial({ color: 0x46e6ff })
  );
  pool.position.set(11.5, 83.1, -12);
  mbs.add(pool);
}

/* --------------------------- ArtScience Museum ---------------------------- */

{
  const lotus = new THREE.Group();
  lotus.position.set(-52, 2, 48);
  scene.add(lotus);

  const petalMat = new THREE.MeshStandardMaterial({
    color: 0xf5f8fc, roughness: 0.28, metalness: 0.06,
    emissive: 0x64788f, emissiveIntensity: 0.4, side: THREE.DoubleSide
  });

  function petalGeometry(w, h, curl) {
    const g = new THREE.PlaneGeometry(w, h, 3, 10);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i);
      const t = (y + h / 2) / h;
      p.setX(i, x * (0.4 + 0.6 * Math.sin(Math.PI * (0.2 + 0.8 * t))));
      p.setZ(i, -curl * h * t * t);
    }
    g.computeVertexNormals();
    return g;
  }

  function addRing(count, radius, w, h, tilt, curl, y) {
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + (count % 2 ? 0 : 0.35);
      const holder = new THREE.Group();
      holder.position.set(Math.cos(a) * radius, y, Math.sin(a) * radius);
      holder.rotation.y = Math.PI / 2 - a;
      const petal = new THREE.Mesh(petalGeometry(w, h, curl), petalMat);
      petal.position.y = h / 2 - 0.5;
      petal.rotation.x = tilt;
      holder.add(petal);
      lotus.add(holder);
    }
  }

  addRing(10, 7.6, 8.4, 15, 1.05, 0.5, 0);
  addRing(8, 4.2, 6.6, 11.5, 0.72, 0.42, 0.6);

  const core = new THREE.Mesh(new THREE.SphereGeometry(4.6, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), petalMat);
  core.scale.set(1, 1.35, 1);
  core.position.y = 0.8;
  lotus.add(core);

  const base = new THREE.Mesh(new THREE.CylinderGeometry(8.5, 10, 3, 24), solidMat);
  base.position.y = -1.2;
  lotus.add(base);
}

/* ---------------------------- Singapore Flyer ----------------------------- */

const flyer = new THREE.Group();
flyer.position.set(60, 2, -5);
scene.add(flyer);

const HUB_Y = 42, RADIUS = 34;
const wheel = new THREE.Group();
wheel.position.y = HUB_Y;
flyer.add(wheel);

const rimMat = new THREE.MeshStandardMaterial({ color: 0x8ba0b8, metalness: 0.85, roughness: 0.35, emissive: 0x18293c, emissiveIntensity: 0.8 });
for (const zz of [-3.2, 3.2]) {
  const rim = new THREE.Mesh(new THREE.TorusGeometry(RADIUS, 1.0, 10, 72), rimMat);
  rim.position.z = zz;
  wheel.add(rim);
}

function strut(a, b, r, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 6), mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(UP, dir.clone().normalize());
  return m;
}

const spokes = 24;
const pods = [];
const podMat = new THREE.MeshStandardMaterial({
  color: 0x9fd8ff, emissive: 0x2d7fb8, emissiveIntensity: 1.1,
  transparent: true, opacity: 0.85, roughness: 0.2, metalness: 0.4
});

for (let i = 0; i < spokes; i++) {
  const a = (i / spokes) * Math.PI * 2;
  const x = Math.cos(a) * RADIUS, y = Math.sin(a) * RADIUS;
  for (const zz of [-3.2, 3.2]) {
    wheel.add(strut(new THREE.Vector3(0, 0, zz), new THREE.Vector3(x, y, zz), 0.22, rimMat));
  }
  const pod = new THREE.Mesh(new THREE.CapsuleGeometry(1.5, 2.6, 4, 10), podMat);
  pod.position.set(Math.cos(a) * (RADIUS + 3), Math.sin(a) * (RADIUS + 3), 0);
  wheel.add(pod);
  pods.push(pod);
}

const hub = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 9, 16), rimMat);
hub.rotation.x = Math.PI / 2;
wheel.add(hub);
wheel.add(strut(new THREE.Vector3(-RADIUS, 0, 0), new THREE.Vector3(RADIUS, 0, 0), 0.3, rimMat));

for (const zz of [-6.5, 6.5]) {
  flyer.add(strut(new THREE.Vector3(-17, 0, zz), new THREE.Vector3(0, HUB_Y, zz), 1.1, trimMat));
  flyer.add(strut(new THREE.Vector3(17, 0, zz), new THREE.Vector3(0, HUB_Y, zz), 1.1, trimMat));
}

/* ------------------------- Esplanade ("durian") domes --------------------- */

{
  const esplanade = new THREE.Group();
  esplanade.position.set(54, 2, 78);
  scene.add(esplanade);

  const shellMat = new THREE.MeshStandardMaterial({
    color: 0xa8b8cb, metalness: 0.75, roughness: 0.4,
    emissive: 0x2a405c, emissiveIntensity: 0.9, flatShading: true
  });
  const spikeGeo = new THREE.ConeGeometry(0.55, 2.8, 4);
  spikeGeo.translate(0, 1.4, 0);
  const golden = Math.PI * (3 - Math.sqrt(5));
  const spikes = 90;
  const sx = 9, sy = 7.4, sz = 12.6;

  for (const [ox, oz] of [[0, -10], [2.5, 11]]) {
    const dome = new THREE.Mesh(new THREE.SphereGeometry(9, 24, 14, 0, Math.PI * 2, 0, Math.PI / 2), shellMat);
    dome.scale.set(1, sy / 9, sz / 9);
    dome.position.set(ox, 0, oz);
    esplanade.add(dome);

    const inst = new THREE.InstancedMesh(spikeGeo, shellMat, spikes);
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), n = new THREE.Vector3();
    for (let i = 0; i < spikes; i++) {
      const cosT = 1 - (i + 0.5) / spikes;
      const sinT = Math.sqrt(Math.max(0, 1 - cosT * cosT));
      const phi = i * golden;
      v.set(sinT * Math.cos(phi) * sx, cosT * sy, sinT * Math.sin(phi) * sz);
      n.set(v.x / (sx * sx), v.y / (sy * sy), v.z / (sz * sz)).normalize();
      q.setFromUnitVectors(UP, n);
      m4.compose(v.clone().addScaledVector(n, -0.2), q, new THREE.Vector3(1, 1, 1));
      inst.setMatrixAt(i, m4);
    }
    inst.instanceMatrix.needsUpdate = true;
    inst.position.set(ox, 0, oz);
    esplanade.add(inst);
  }

  const deck = new THREE.Mesh(new THREE.BoxGeometry(30, 2.5, 44), solidMat);
  deck.position.y = 0.4;
  esplanade.add(deck);
}

/* ------------------------------- Supertrees ------------------------------- */

{
  const trunkMat = new THREE.MeshStandardMaterial({
    color: 0x232833, roughness: 0.9, emissive: 0x123526, emissiveIntensity: 0.6
  });
  const hueList = [0x1e7a4a, 0x1e6a7a, 0x59307a, 0x2a6a3a, 0x1e5f8a, 0x2f7a55];

  for (let i = 0; i < 6; i++) {
    const x = -108 - (i % 3) * 16 + rand(-3, 3);
    const z = -70 + i * 26 + rand(-6, 6);
    const h = rand(28, 44);
    const hue = hueList[i % hueList.length];
    const canopyMat = new THREE.MeshStandardMaterial({
      color: 0x0d1d16, roughness: 0.85,
      emissive: hue, emissiveIntensity: 0.5
    });

    const tree = new THREE.Group();
    tree.position.set(x, 2, z);
    scene.add(tree);

    const trunkH = h * 0.72;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 2.8, trunkH, 8), trunkMat);
    trunk.position.y = trunkH / 2;
    tree.add(trunk);

    const topR = h * 0.34, canH = h * 0.42;
    const canopy = new THREE.Mesh(new THREE.CylinderGeometry(topR, h * 0.07, canH, 14), canopyMat);
    canopy.position.y = trunkH + canH / 2;
    tree.add(canopy);

    const cap = new THREE.Mesh(new THREE.SphereGeometry(topR, 14, 6, 0, Math.PI * 2, 0, Math.PI / 2), canopyMat);
    cap.scale.set(1, 0.35, 1);
    cap.position.y = trunkH + canH;
    tree.add(cap);
  }
}

/* ------------------------------ boats & lamps ----------------------------- */

{
  const hullMat = new THREE.MeshStandardMaterial({ color: 0x1a2432, roughness: 0.7, metalness: 0.3 });
  const cabinMat = windowMaterial(8, 3, 2.5, 2, 0xffd9a0, 1.4);
  const lightMat = new THREE.MeshBasicMaterial({ color: 0xffe9c0 });
  const fleet = [[-12, 25, 0.4], [18, -70, -0.8], [-30, -115, 0.2]];

  for (const [bx, bz, rot] of fleet) {
    const boat = new THREE.Group();
    boat.position.set(bx, 0.8, bz);
    boat.rotation.y = rot;

    const hull = new THREE.Mesh(new THREE.BoxGeometry(4.5, 1.6, 13), hullMat);
    hull.position.y = 0.4;
    boat.add(hull);

    const bow = new THREE.Mesh(new THREE.ConeGeometry(2.2, 5, 4), hullMat);
    bow.rotation.x = Math.PI / 2;
    bow.position.set(0, 0.4, 8.5);
    boat.add(bow);

    const cabin = new THREE.Mesh(new THREE.BoxGeometry(3.6, 2.4, 5), cabinMat);
    cabin.position.set(0, 2.3, -1);
    boat.add(cabin);

    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 4, 6), hullMat);
    mast.position.set(0, 5, 3);
    boat.add(mast);

    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), lightMat);
    lamp.position.set(0, 7, 3);
    boat.add(lamp);

    scene.add(boat);
  }

  const lampGeo = new THREE.SphereGeometry(0.55, 6, 6);
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xffc97a });
  const zs = [];
  for (let z = -230; z <= 150; z += 26) zs.push(z);
  const inst = new THREE.InstancedMesh(lampGeo, lampMat, zs.length * 2);
  const m4 = new THREE.Matrix4();
  let li = 0;
  for (const z of zs) {
    m4.setPosition(-42, 3.3, z);
    inst.setMatrixAt(li++, m4);
    m4.setPosition(42, 3.3, z);
    inst.setMatrixAt(li++, m4);
  }
  inst.instanceMatrix.needsUpdate = true;
  scene.add(inst);
}

/* ------------------------------- postprocess ------------------------------ */

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.55, 0.78);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* --------------------------------- resize --------------------------------- */

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

/* --------------------------------- animate -------------------------------- */

const clock = new THREE.Clock();

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  wheel.rotation.z += dt * 0.055;
  for (const pod of pods) pod.rotation.z = -wheel.rotation.z;

  waterTint.material.opacity = 0.5 + Math.sin(t * 0.7) * 0.04;

  for (const b of blinkers) {
    const k = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * 2.4 + b.phase));
    b.mat.color.setRGB(k, k * 0.12, k * 0.12);
  }

  controls.update();
  composer.render();
});
</script>
