function makeCamo(){
  const S=1024;
  const c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d');
  g.fillStyle='#99a1a2';g.fillRect(0,0,S,S);
  const blob=(col,alpha,R,n)=>{
    g.fillStyle=col;g.globalAlpha=alpha;
    for(let i=0;i<n;i++){
      const cx=Math.random()*S,cy=Math.random()*S;
      const r=R*(0.6+Math.random()*0.9);
      const seed=Math.random()*10;
      const wob=0.16+Math.random()*0.18;
      for(const ox of [-S,0,S])for(const oy of [-S,0,S]){
        g.beginPath();
        for(let s=0;s<=18;s++){
          const a=s/18*Math.PI*2;
          const rr=r*(1-wob*0.5+wob*Math.sin(a*3+seed)+0.12*Math.sin(a*7+seed*2));
          const px=cx+ox+Math.cos(a)*rr,py=cy+oy+Math.sin(a)*rr;
          if(s===0)g.moveTo(px,py);else g.lineTo(px,py);
        }
        g.closePath();g.fill();
      }
    }
    g.globalAlpha=1;
  };
  blob('#828b88',0.5,150,24);
  blob('#6f7873',0.34,110,18);
  blob('#abb2b1',0.26,140,16);
  for(let i=0;i<26000;i++){
    g.fillStyle=Math.random()<0.5?'rgba(58,64,64,0.05)':'rgba(222,228,226,0.045)';
    g.fillRect(Math.random()*S,Math.random()*S,1+Math.random()*2,1+Math.random()*2);
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=8;
  return t;
}

  t.anisotropy=8;
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

function addMesh(geo,mat,parent,x=0,y=0,z=0,rx=0,ry=0,rz=0){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);
  m.rotation.set(rx,ry,rz);
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}
const addBox=(p,w,h,d,mat,x=0,y=0,z=0,rx=0,ry=0,rz=0)=>addMesh(new THREE.BoxGeometry(w,h,d),mat,p,x,y,z,rx,ry,rz);
const addCyl=(p,rt,rb,h,mat,x=0,y=0,z=0,rx=0,ry=0,rz=0,seg=16)=>addMesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat,p,x,y,z,rx,ry,rz);
const addSph=(p,r,mat,x,y,z,sx=1,sy=1,sz=1)=>{
  const m=addMesh(new THREE.SphereGeometry(r,22,16),mat,p,x,y,z);
  m.scale.set(sx,sy,sz);
  return m;
};
function strut(p,a,b,r,mat,seg=10){
  const d=new THREE.Vector3().subVectors(b,a);
  const len=d.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg),mat);
  m.position.copy(a).addScaledVector(d,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
  m.castShadow=true;
  m.receiveShadow=true;
  p.add(m);
  return m;
}
function profile(p,pts,width,mat,bevel=0.05){
  const s=new THREE.Shape();
  s.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)s.lineTo(pts[i][0],pts[i][1]);
  s.closePath();
  const geo=new THREE.ExtrudeGeometry(s,{depth:width,bevelEnabled:bevel>0,bevelThickness:bevel,bevelSize:bevel,bevelSegments:2,curveSegments:4});
  geo.rotateY(-Math.PI/2);
  geo.translate(width/2,0,0);
  const m=new THREE.Mesh(geo,mat);
  m.castShadow=true;
  m.receiveShadow=true;
  p.add(m);
  return m;
}
function quad(p,c,mat){
  const g=new THREE.BufferGeometry();
  const order=[c[0],c[1],c[2],c[0],c[2],c[3]];
  const arr=new Float32Array(18);
  for(let i=0;i<6;i++){arr[i*3]=order[i].x;arr[i*3+1]=order[i].y;arr[i*3+2]=order[i].z;}
  g.setAttribute('position',new THREE.BufferAttribute(arr,3));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);
  m.castShadow=false;
  m.receiveShadow=false;
  p.add(m);
  return m;
}
function frameQuad(p,c,r,mat){
  for(let i=0;i<4;i++)strut(p,c[i],c[(i+1)%4],r,mat,6);
}

function podFaceTexPlaceholder(){
  if(!podFaceTexPlaceholder.tex){
    podFaceTexPlaceholder.tex=canvasTex(256,256,(g,w)=>{
      const c=w/2;
      g.fillStyle='#3f423c';g.fillRect(0,0,w,w);
      g.beginPath();g.arc(c,c,122,0,Math.PI*2);g.strokeStyle='#22241f';g.lineWidth=10;g.stroke();
      const hole=(x,y)=>{g.beginPath();g.arc(x,y,17,0,Math.PI*2);g.fillStyle='#0a0b0c';g.fill();g.strokeStyle='rgba(255,255,255,0.08)';g.lineWidth=2;g.stroke();};
      hole(c,c);
      for(let i=0;i<6;i++){const a=i/6*Math.PI*2;hole(c+Math.cos(a)*44,c+Math.sin(a)*44);}
      for(let i=0;i<12;i++){const a=i/12*Math.PI*2+Math.PI/12;hole(c+Math.cos(a)*84,c+Math.sin(a)*84);}
    });
  }
  return podFaceTexPlaceholder.tex;
}

function decal(tex,w,h,pos,ry,rx=0){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({

    depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4
  }));
  m.position.copy(pos);
  m.rotation.set(rx,ry,0);
  m.castShadow=false;
  m.receiveShadow=false;
  air.add(m);
  return m;
}

});

const clock=new THREE.Clock();

const loading=document.getElementById('loading');

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  rotorSpeed+=(rotorTarget-rotorSpeed)*Math.min(1,dt*0.55);
  rotor.rotation.y+=rotorSpeed*dt;
  const t=Math.min(1,rotorSpeed/rotorMax);
  const droop=D(-2.4*(1-t)+0.7*t);
  for(const b of blades)b.rotation.z=droop;
  controls.update();
  renderer.render(scene,camera);
  if(!started){
    started=true;
    loading.style.opacity='0';
    setTimeout(()=>loading.remove(),1200);
  }
}
