<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a Bicycle</title>
<style>
/* ==========================================================================
   Pelican on a Bicycle - pure SVG + CSS @keyframes. No JavaScript, no libs.

   Everything is timed from one number:
     --wheel  one wheel revolution. The tyre radius is 80 units, so the road
              must slide past at 2*pi*80 / --wheel units per second; every
              scenery strip below is a multiple of --wheel, scaled by depth.
     --crank  one pedal revolution. A 16-tooth chainring drives a 10-tooth
              cog, so the cranks turn 1.6x slower than the wheels.
   The thigh / shin / foot keyframes were solved with two-bone inverse
   kinematics, so the webbed feet stay on the pedals all the way round.
   ========================================================================== */
:root {
  --wheel: .8s;
  --crank: calc(var(--wheel) * 1.6);
}

* { box-sizing: border-box; }
html { height: 100%; background: #121826; }
body {
  min-height: 100%;
  margin: 0;
  display: grid;
  place-items: center;
  padding: clamp(12px, 3vh, 36px) 2vw;
  background: radial-gradient(120% 90% at 50% 20%, #33476b 0%, #1a2233 60%, #121826 100%);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.piece {
  margin: 0;
  /* as large as the window allows, leaving room for the prompt underneath */
  width: min(94vw, max(340px, calc((100vh - 230px) * 12 / 7)));
}
.stage {
  position: relative;
  aspect-ratio: 12 / 7;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 28px 70px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .08);
}
.stage > svg { display: block; width: 100%; height: 100%; }

/* ---------- the prompt this page was made from ---------- */
.prompt {
  margin-top: clamp(14px, 2.4vh, 22px);
  padding: 15px 20px 17px;
  border: 1px solid rgba(255, 255, 255, .09);
  border-radius: 14px;
  background: rgba(255, 255, 255, .045);
  color: #dfe6f1;
}
.prompt-label {
  display: block;
  margin-bottom: 6px;
  color: #ffd978;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.prompt blockquote { margin: 0; }
.prompt p { margin: 0; font-size: clamp(14px, 1.2vw, 16px); line-height: 1.6; text-wrap: pretty; }

/* ---------- pause / play (CSS-only checkbox toggle) ---------- */
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.toggle {
  position: absolute; right: 1.4%; bottom: 2.2%;
  display: inline-flex; align-items: center;
  padding: 7px 13px 7px 10px; border-radius: 999px;
  background: rgba(24, 30, 44, .62); color: #fff;
  font-size: 13px; font-weight: 600; letter-spacing: .02em;
  cursor: pointer; user-select: none;
  transition: background .2s;
}
.toggle:hover { background: rgba(24, 30, 44, .82); }
.toggle span { display: inline-flex; align-items: center; gap: 7px; }
.toggle svg { width: 12px; height: 12px; fill: currentColor; }
.toggle .when-paused { display: none; }
#pause:checked ~ .piece .when-running { display: none; }
#pause:checked ~ .piece .when-paused { display: inline-flex; }
#pause:focus-visible ~ .piece .toggle { outline: 3px solid #ffd978; outline-offset: 2px; }
#pause:checked ~ .piece .stage * { animation-play-state: paused !important; }

/* ---------- drivetrain ---------- */
@keyframes spin      { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes spin-back { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

.wheel-spin  { animation: spin var(--wheel) linear infinite; }
.crank-spin  { animation: spin var(--crank) linear infinite; }
.pedal-level { animation: spin-back var(--crank) linear infinite; }   /* keeps pedals flat */
.thigh       { animation: thigh var(--crank) linear infinite; }
.shin        { animation: shin  var(--crank) linear infinite; }
.foot        { animation: foot  var(--crank) linear infinite; }
.far         { animation-delay: calc(var(--crank) * -.5); }           /* other pedal: half a turn on */

.chain { animation: chain calc(var(--crank) * 2.625) linear infinite; }
@keyframes chain { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -42; } }

/* inverse-kinematics leg poses, one key every 10 degrees of crank */
@keyframes thigh {

  22.22%{transform:rotate(53.27deg)} 25%{transform:rotate(53.94deg)} 27.78%{transform:rotate(54.01deg)} 30.56%{transform:rotate(53.56deg)}
  33.33%{transform:rotate(52.66deg)} 36.11%{transform:rotate(51.4deg)} 38.89%{transform:rotate(49.82deg)} 41.67%{transform:rotate(47.97deg)}
  44.44%{transform:rotate(45.88deg)} 47.22%{transform:rotate(43.57deg)} 50%{transform:rotate(41.05deg)} 52.78%{transform:rotate(38.34deg)}
  55.56%{transform:rotate(35.48deg)} 58.33%{transform:rotate(32.51deg)} 61.11%{transform:rotate(29.47deg)} 63.89%{transform:rotate(26.47deg)}
  66.67%{transform:rotate(23.62deg)} 69.44%{transform:rotate(21.04deg)} 72.22%{transform:rotate(18.88deg)} 75%{transform:rotate(17.26deg)}
  77.78%{transform:rotate(16.28deg)} 80.56%{transform:rotate(15.99deg)} 83.33%{transform:rotate(16.4deg)} 86.11%{transform:rotate(17.5deg)}
  88.89%{transform:rotate(19.21deg)} 91.67%{transform:rotate(21.47deg)} 94.44%{transform:rotate(24.19deg)} 97.22%{transform:rotate(27.27deg)}
  100%{transform:rotate(30.62deg)}
}
@keyframes shin {
  0%{transform:rotate(69.29deg)} 2.78%{transform:rotate(64.22deg)} 5.56%{transform:rotate(59.36deg)} 8.33%{transform:rotate(54.9deg)}
  11.11%{transform:rotate(51.01deg)} 13.89%{transform:rotate(47.9deg)} 16.67%{transform:rotate(45.79deg)} 19.44%{transform:rotate(44.84deg)}
  22.22%{transform:rotate(45.13deg)} 25%{transform:rotate(46.63deg)} 27.78%{transform:rotate(49.2deg)} 30.56%{transform:rotate(52.65deg)}
  33.33%{transform:rotate(56.77deg)} 36.11%{transform:rotate(61.35deg)} 38.89%{transform:rotate(66.24deg)} 41.67%{transform:rotate(71.28deg)}
  44.44%{transform:rotate(76.34deg)} 47.22%{transform:rotate(81.33deg)} 50%{transform:rotate(86.11deg)} 52.78%{transform:rotate(90.6deg)}
  55.56%{transform:rotate(94.7deg)} 58.33%{transform:rotate(98.3deg)} 61.11%{transform:rotate(101.3deg)} 63.89%{transform:rotate(103.61deg)}
  66.67%{transform:rotate(105.16deg)} 69.44%{transform:rotate(105.89deg)} 72.22%{transform:rotate(105.76deg)} 75%{transform:rotate(104.79deg)}
  77.78%{transform:rotate(103deg)} 80.56%{transform:rotate(100.46deg)} 83.33%{transform:rotate(97.24deg)} 86.11%{transform:rotate(93.44deg)}
  88.89%{transform:rotate(89.16deg)} 91.67%{transform:rotate(84.49deg)} 94.44%{transform:rotate(79.55deg)} 97.22%{transform:rotate(74.45deg)}
  100%{transform:rotate(69.29deg)}
}
@keyframes foot {
  0%{transform:rotate(-105.92deg)} 2.78%{transform:rotate(-104.17deg)} 5.56%{transform:rotate(-102.34deg)} 8.33%{transform:rotate(-100.48deg)}
  11.11%{transform:rotate(-98.7deg)} 13.89%{transform:rotate(-97.1deg)} 16.67%{transform:rotate(-95.79deg)} 19.44%{transform:rotate(-94.89deg)}
  22.22%{transform:rotate(-94.48deg)} 25%{transform:rotate(-94.56deg)} 27.78%{transform:rotate(-95.12deg)} 30.56%{transform:rotate(-96.1deg)}
  33.33%{transform:rotate(-97.43deg)} 36.11%{transform:rotate(-99.04deg)} 38.89%{transform:rotate(-100.87deg)} 41.67%{transform:rotate(-102.86deg)}
  44.44%{transform:rotate(-104.95deg)} 47.22%{transform:rotate(-107.07deg)} 50%{transform:rotate(-109.16deg)} 52.78%{transform:rotate(-111.13deg)}
  55.56%{transform:rotate(-112.91deg)} 58.33%{transform:rotate(-114.41deg)} 61.11%{transform:rotate(-115.58deg)} 63.89%{transform:rotate(-116.37deg)}
  66.67%{transform:rotate(-116.78deg)} 69.44%{transform:rotate(-116.82deg)} 72.22%{transform:rotate(-116.56deg)} 75%{transform:rotate(-116.05deg)}
  77.78%{transform:rotate(-115.36deg)} 80.56%{transform:rotate(-114.55deg)} 83.33%{transform:rotate(-113.64deg)} 86.11%{transform:rotate(-112.65deg)}
  88.89%{transform:rotate(-111.56deg)} 91.67%{transform:rotate(-110.36deg)} 94.44%{transform:rotate(-109.02deg)} 97.22%{transform:rotate(-107.54deg)}
  100%{transform:rotate(-105.92deg)}
}

/* ---------- scenery: seamless strips sliding backwards ---------- */
@keyframes scroll-1200 { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
@keyframes scroll-600  { from { transform: translateX(0); } to { transform: translateX(-600px); } }
@keyframes scroll-400  { from { transform: translateX(0); } to { transform: translateX(-400px); } }
@keyframes scroll-300  { from { transform: translateX(0); } to { transform: translateX(-300px); } }
@keyframes scroll-240  { from { transform: translateX(0); } to { transform: translateX(-240px); } }
@keyframes scroll-200  { from { transform: translateX(0); } to { transform: translateX(-200px); } }

.strip { animation-timing-function: linear; animation-iteration-count: infinite; }
.clouds-far  { animation-name: scroll-1200; animation-duration: calc(var(--wheel) * 149.2078); }
.clouds-near { animation-name: scroll-1200; animation-duration: calc(var(--wheel) * 70.2154); }
.gulls       { animation-name: scroll-1200; animation-duration: calc(var(--wheel) * 47.7465); }
.horizon     { animation-name: scroll-1200; animation-duration: calc(var(--wheel) * 99.4718); }
.glints      { animation-name: scroll-600;  animation-duration: calc(var(--wheel) * 17.0523); }
.foam        { animation-name: scroll-600;  animation-duration: calc(var(--wheel) * 3.1469); }
.beach       { animation-name: scroll-1200; animation-duration: calc(var(--wheel) * 4.1959); }
.wall        { animation-name: scroll-300;  animation-duration: calc(var(--wheel) * 0.8145); }
.walk        { animation-name: scroll-240;  animation-duration: calc(var(--wheel) * 0.6086); }
.road        { animation-name: scroll-400;  animation-duration: calc(var(--wheel) * 0.7958); }
.dashes      { animation-name: scroll-200;  animation-duration: calc(var(--wheel) * 0.3357); }
.near        { animation-name: scroll-400;  animation-duration: calc(var(--wheel) * 0.6073); }

@keyframes glow { from { transform: scale(1); opacity: .85; } to { transform: scale(1.12); opacity: 1; } }
.sun-glow { animation: glow 3.2s ease-in-out infinite alternate; }

@keyframes twinkle { 0%, 100% { opacity: .1; } 50% { opacity: .9; } }
.glints rect { animation: twinkle 2.4s ease-in-out infinite; }
.glints rect:nth-child(3n)   { animation-delay: -.8s; }
.glints rect:nth-child(3n+1) { animation-delay: -1.6s; }

@keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-.55); } }
.gull { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .42s ease-in-out infinite alternate; }
.gull.g2 { animation-delay: -.2s; }
.gull.g3 { animation-duration: .5s; }

@keyframes rock { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
.boat { animation: rock 2.6s ease-in-out infinite alternate; }
.boat.b2 { animation-delay: -1.3s; }

/* ---------- the rider's body language ---------- */
@keyframes bob   { from { transform: translateY(-1.2px); } to { transform: translateY(2.2px); } }
@keyframes sway  { from { transform: rotate(-1.8deg); } to { transform: rotate(1.4deg); } }
@keyframes pouch { from { transform: scale(1, 1); } to { transform: scale(1.02, .92); } }
@keyframes blink { 0%, 91%, 97%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.08); } }
@keyframes ruffle { from { transform: rotate(-6deg); } to { transform: rotate(5deg); } }
@keyframes scarf { from { transform: rotate(-5deg) scale(1, .9); } to { transform: rotate(6deg) scale(1.05, 1.1); } }

.bob    { animation: bob calc(var(--crank) / 4) ease-in-out infinite alternate; }
.sway   { animation: sway calc(var(--crank) / 2) ease-in-out infinite alternate; animation-delay: calc(var(--crank) * -.12); }
.pouch  { animation: pouch calc(var(--crank) / 4) ease-in-out infinite alternate; animation-delay: calc(var(--crank) * -.18); }
.blink  { animation: blink 4.6s linear infinite; }
.crest  { animation: ruffle .2s ease-in-out infinite alternate; }
.crest.c2 { animation-delay: -.1s; }
.scarf-a { animation: scarf .26s ease-in-out infinite alternate; }
.scarf-b { animation: scarf .26s ease-in-out infinite alternate; animation-delay: -.13s; }

@keyframes whoosh {
  0%   { transform: translateX(70px); opacity: 0; }
  30%  { opacity: .9; }
  100% { transform: translateX(-150px); opacity: 0; }
}
.whoosh path { animation: whoosh 1.05s linear infinite; }
.whoosh path:nth-child(2) { animation-delay: -.45s; }
.whoosh path:nth-child(3) { animation-delay: -.2s; }
.whoosh path:nth-child(4) { animation-delay: -.75s; }

@keyframes dust {
  0%   { transform: translate(0, 0) scale(.3); opacity: .75; }
  100% { transform: translate(-150px, -14px) scale(1.7); opacity: 0; }
}
.dust circle { transform-box: fill-box; transform-origin: center; animation: dust .75s ease-in infinite; }
.dust circle:nth-child(2) { animation-delay: -.25s; }
.dust circle:nth-child(3) { animation-delay: -.5s; }
</style>
</head>
<body>
<main>
<input type="checkbox" id="pause" class="sr-only">
<figure class="piece">
<div class="stage">
<svg viewBox="0 0 1200 700" role="img" aria-labelledby="scene-title scene-desc">
<title id="scene-title">A pelican riding a bicycle</title>
<desc id="scene-desc">A cartoon white pelican with a big yellow throat pouch pedals a red bicycle along a seaside road while the beach, sea and clouds scroll past.</desc>

<defs>

  </linearGradient>
  <radialGradient id="sun-halo">
